openapi: 3.1.0
info:
  title: DrRainAI Draft API
  version: 0.1.0-draft
  description: >-
    DRAFT only; endpoints and authentication are proposals, not approved or implemented.
    Authentication is intentionally unresolved. 仅为草案；路径与身份验证方式均未批准或实现，认证机制尚未决定。
servers:
  - url: https://api.example.invalid
    description: Placeholder; replace only after environment approval. / 占位地址，获批环境后替换。
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a session / 创建会话
      description: Proposed operation. Identity and guest mode are unresolved. / 提案；身份与访客模式未决。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Session created / 会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/runs:
    post:
      operationId: createRun
      summary: Create a chat run / 创建聊天运行
      description: >-
        Proposed operation. Core verifies ownership and persists the user message and run
        before the Agent is invoked. / 提案。Core 在调用 Agent 前验证所有权并持久化用户消息与运行。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Run accepted / 运行已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: Stream run events / 流式获取运行事件
      description: Draft Server-Sent Events stream. Reconnect and replay are unresolved. / SSE 草案；重连与重放未决。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: Reserved; replay semantics are unresolved. / 预留；重放语义未决。
          schema:
            type: string
      responses:
        '200':
          description: SSE stream / SSE 流
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Request run cancellation / 请求取消运行
      description: Best-effort cancellation; terminal status remains authoritative. / 尽力取消；终态仍以服务端为准。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Cancellation accepted or already terminal / 已接收取消请求或运行已结束
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Gateway validates or creates a correlation ID. / Gateway 验证或生成关联 ID。
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retry behavior and retention window require approval. / 重试行为与保留时长待批准。
      schema:
        type: string
        maxLength: 128
  schemas:
    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRunRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 20000
          description: Limit is a draft pending product review. / 草案上限，待产品评审。
    RunAccepted:
      type: object
      required: [run_id, events_url, status]
      properties:
        run_id:
          type: string
        events_url:
          type: string
          format: uri-reference
        status:
          const: accepted
    Problem:
      type: object
      description: Problem Details compatible error envelope. / 兼容 Problem Details 的错误封装。
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Safe, non-sensitive detail. / 安全且不含敏感信息的详情。
        request_id:
          type: string
  responses:
    Problem:
      description: Request failed / 请求失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
