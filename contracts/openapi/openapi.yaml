openapi: 3.1.0
info:
  title: DrRainAI 接口草案
  version: 0.1.0-draft
  description: 接口草案；路径与身份验证方式均未批准或实现，认证机制尚未决定。
servers:
  - url: https://api.example.invalid
    description: 占位地址，获批环境后替换。
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: 创建会话
      description: 提案；MVP 使用已认证用户，不提供访客模式。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 会话已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/sessions/{session_id}/runs:
    post:
      operationId: createRun
      summary: 创建聊天运行
      description: 提案。Core 在调用 Agent 前验证所有权并持久化用户消息与运行。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: 运行已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: 流式获取运行事件
      description: SSE 草案；重连与重放未决。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: 预留；重放语义未决。
          schema:
            type: string
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: 请求取消运行
      description: 尽力取消；终态仍以服务端为准。
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: 已接收取消请求或运行已结束
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Gateway 验证或生成关联 ID。
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 重试行为与保留时长待批准。
      schema:
        type: string
        maxLength: 128
  schemas:
    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRunRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 20000
          description: 草案上限，待产品评审。
    RunAccepted:
      type: object
      required: [run_id, events_url, status]
      properties:
        run_id:
          type: string
        events_url:
          type: string
          format: uri-reference
        status:
          const: accepted
    Problem:
      type: object
      description: 兼容 Problem Details 的错误封装。
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: 安全且不含敏感信息的详情。
        request_id:
          type: string
  responses:
    Problem:
      description: 请求失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
